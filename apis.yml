name: Verdant
description: >-
  Verdant is an AI-native land-use permitting and planning software platform for local
  governments, spanning the entire process from a resident's first question through plan
  review to a commission's final vote. Applicants file complete, compliant applications
  upfront, and Verdant's AI reads documents, site plans, and diagrams to flag issues and
  draft staff review reports that municipal staff can approve. The platform is modular,
  letting jurisdictions buy only the modules they need, configured to their ordinances,
  workflows, and forms, and includes ordinance-research tooling to benchmark against peer
  jurisdictions and find gaps in local codes. Verdant is a Y Combinator Summer 2026
  company; it currently ships an application product for cities and does not publish a
  public developer API.
